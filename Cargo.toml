[package]
name = "oxydengine"
version = "0.0.1"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "22.1"
glam = { version = "0.28", features = ["serde"] }
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", features = ["jpeg", "png"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
